<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#3b82f6">
<title>سيارات</title>
<style>
:root{--b:#3b82f6;--bd:#2563eb;--bg:#f1f3f8;--ink:#1f2937;--mut:#8b95a3;--card:#fff;--in:#f1f2f6;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--ink:#f3f4f6;--mut:#8b95a3;--card:#18202a;--in:#222c38;--line:#2b3644}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:88px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hero{background:var(--b);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 74px;text-align:center;transition:padding .3s}
.hero.s{padding-bottom:26px}
.hero h1{font-size:24px}.hero p{font-size:13px;opacity:.92}
.sheet{background:var(--card);border-radius:20px;box-shadow:0 4px 18px #0000001a;padding:12px;margin:-54px 12px 14px;position:relative;animation:up .4s both}
.wrap{max-width:980px;margin:auto;padding:14px 12px 0}
.sheet+.wrap{padding-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.f{width:100%;background:var(--in);border:0;border-radius:16px;padding:14px 16px;outline:0}
.f:focus{box-shadow:0 0 0 2px var(--b)}
textarea.f{min-height:90px}
label{display:block;font-weight:700;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 12px #0000001a;position:relative;cursor:pointer;animation:up .45s both;animation-delay:calc(var(--i)*45ms);transition:transform .15s}
.car:active{transform:scale(.97)}
.car img,.ph0{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--in)}
.in{padding:12px 14px 14px}
.in h3{font-size:16px}
.pr b{color:var(--b);font-size:20px}.pr span{color:var(--mut);font-size:13px}
.meta{color:var(--mut);font-size:13px}
.heart{position:absolute;top:10px;left:10px;width:38px;height:38px;border:0;border-radius:50%;background:#fffd;color:#6b7280;display:grid;place-items:center;cursor:pointer}
.heart.on{color:#ef4444;animation:pop .3s}
.heart.on svg{fill:#ef4444}
.sold{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;padding:2px 12px;border-radius:10px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:50px 10px;grid-column:1/-1}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);display:flex;box-shadow:0 -2px 14px #0000001a;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;cursor:pointer;transition:color .2s,transform .15s}
nav button.on{color:var(--b);font-weight:700}
nav button:active{transform:scale(.92)}
#m{position:fixed;inset:0;display:none;z-index:10}
#m.on{display:block}
.page{position:absolute;inset:0;background:var(--bg);overflow:auto;animation:slide .3s ease;padding-bottom:150px}
.ph{background:var(--b);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 14px 16px;position:sticky;top:0;z-index:2}
.ph h2{font-size:18px}
.bk{background:none;border:0;color:#fff;display:grid;place-items:center;cursor:pointer}
.pb{padding:12px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0000001a;animation:up .35s both}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px}
.gal img{height:210px;border-radius:16px;flex:none;scroll-snap-align:center}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
dt{color:var(--mut)}
.bar{position:fixed;bottom:0;inset-inline:0;background:var(--card);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #0000001f;z-index:3}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sum b{color:var(--b);font-size:20px}
.btns{display:flex;gap:10px}
.b1,.b2,.lnk{flex:1;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block;transition:transform .15s}
.b1,.lnk{background:var(--b);color:#fff;border:2px solid var(--b)}
.b2{background:transparent;color:var(--b);border:2px solid var(--b)}
.b1:active,.b2:active,.lnk:active{transform:scale(.96)}
.b1[disabled]{opacity:.6}
.lnk+.lnk{margin-top:8px;background:transparent;color:var(--b)}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;cursor:pointer}
.li+.li{border-top:1px solid var(--line)}
.ic{width:48px;height:48px;border-radius:14px;background:var(--in);display:grid;place-items:center;flex:none}
.ic.bl{background:var(--b);color:#fff}
.ch{margin-inline-start:auto;color:var(--ink)}
.mini{background:var(--in);border:0;border-radius:10px;padding:6px 12px;margin:8px 0 0 6px;cursor:pointer;font-size:13px}
#t{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;display:none;max-width:90vw;animation:up .25s}
 .sbar{display:flex;gap:8px}
.fbtn{position:relative;width:52px;flex:none;border:0;border-radius:16px;background:var(--b);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.fbtn:active{transform:scale(.93)}
.fbtn i{position:absolute;top:-6px;left:-6px;background:#ef4444;color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.chips:empty{display:none}
.chip{flex:none;background:#e8f0fe;color:#2563eb;border:0;border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;animation:pop .25s}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt button{background:var(--in);border:2px solid transparent;border-radius:14px;padding:9px 16px;cursor:pointer;transition:all .15s}
.opt button.on{background:#e8f0fe;border-color:var(--b);color:#2563eb;font-weight:700}
 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tiles.cut .tile:nth-child(n+10){display:none}
.tile{background:var(--in);border:2px solid transparent;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12px;color:var(--ink);transition:transform .15s,border-color .15s,background .15s;text-align:center}
.tile:active{transform:scale(.95)}
.tile.on{border-color:var(--b);background:#e8f0fe;color:#2563eb;font-weight:700}
.tile svg{color:currentColor}
.w{fill:var(--card);stroke:currentColor;stroke-width:2.5}
.lg{position:relative;width:54px;height:54px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--b);font-size:22px;overflow:hidden}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:var(--card)}
.more{width:100%;margin-top:10px;background:none;border:0;color:var(--b);font-weight:700;cursor:pointer;padding:8px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
</style>
</head>
<body>
<div class="hero"><h1 id="ttl">سيارات</h1><p id="sub">بيع وشراء السيارات في العراق</p></div>
<div class="sheet" id="filters">
  <div class="sbar"><input class="f" id="q" type="search" placeholder="ابحث عن ماركة أو موديل..." oninput="F.q=this.value;debounce()"><button class="fbtn" onclick="filterPage()" aria-label="الفلاتر"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><i id="fcnt" hidden>0</i></button></div>
  <div class="chips" id="chips"></div>
</div>
<div class="wrap"><div class="meta" id="cnt" style="margin:0 4px 10px"></div><div class="grid" id="grid"></div><div id="acct" hidden></div></div>
<nav id="nav"></nav>
<div id="m"></div>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://mtnzfgmvfpgsibboaqna.supabase.co';
const SB_KEY='sb_publishable_Ny2ORsi2lUCSvLU8FZmjJQ_ZfMJgj8P';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CITIES=['بغداد','البصرة','نينوى','أربيل','السليمانية','دهوك','كركوك','النجف','كربلاء','بابل','ذي قار','ديالى','الأنبار','ميسان','واسط','المثنى','القادسية','صلاح الدين','حلبجة'];
const FUEL={petrol:'بنزين',diesel:'ديزل',hybrid:'هايبرد',electric:'كهرباء'},TR={automatic:'اوتوماتيك',manual:'عادي'},CO={new:'جديدة',used:'مستعملة'};
let user=null,favs=new Set(),cars=[],view='all',timer;

const opts=(o,ph)=>(ph?`<option value="">${ph}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const cityOpts=ph=>(ph?`<option value="">${ph}</option>`:'')+CITIES.map(c=>`<option>${c}</option>`).join('');

function toast(t,ms=3000){const e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function closeM(){$('#m').classList.remove('on');$('#m').innerHTML=''}
const debounce=()=>{clearTimeout(timer);timer=setTimeout(load,350)};
const safeImg=u=>typeof u==='string'&&u.startsWith(SB_URL+'/storage/')?u:'';
const phoneClean=p=>String(p||'').replace(/[^0-9+]/g,'');
const waNum=p=>{p=phoneClean(p).replace(/^\+/,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='964'+p.slice(1);return p};

/* ---------- ui ---------- */
const I={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',plus:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',back:'<path d="M5 12h14M13 6l6 6-6 6"/>',chev:'<path d="M15 6l-6 6 6 6"/>',list:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=(k,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
let acctOpen=false;
function page(title,body,bar){
  const d=document.createElement('div');d.className='page';
  d.innerHTML=`<div class="ph"><button class="bk" aria-label="رجوع" onclick="closeM()">${ic('back')}</button><h2>${esc(title)}</h2></div><div class="pb">${body}</div>${bar?`<div class="bar">${bar}</div>`:''}`;
  $('#m').innerHTML='';$('#m').appendChild(d);$('#m').classList.add('on');
}
function navRender(){
  const a=(on,i,l,fn)=>`<button class="${on?'on':''}" onclick="${fn}">${ic(i)}<span>${l}</span></button>`;
  $('#nav').innerHTML=a(view==='all'&&!acctOpen,'home','الرئيسية',"setView('all')")+a(false,'plus','بيع',"sellForm()")+a(view==='favs'&&!acctOpen,'heart','المفضلة',"setView('favs')")+a(acctOpen||view==='mine','user','حسابي',"openAcct()");
}
function layout(){
  const T={all:['سيارات','بيع وشراء السيارات في العراق'],favs:['المفضلة','السيارات اللي حفظتها'],mine:['إعلاناتي','إدارة إعلاناتك']};
  const t=acctOpen?['حسابي',user?user.email:'سجّل دخولك لاستخدام كل المزايا']:T[view];
  const home=view==='all'&&!acctOpen;
  $('#ttl').textContent=t[0];$('#sub').textContent=t[1];
  $('#filters').hidden=!home;$('#cnt').hidden=!home;$('.hero').classList.toggle('s',!home);
  $('#grid').hidden=acctOpen;$('#acct').hidden=!acctOpen;navRender();
}
function setView(v){
  if(v!=='all'&&!user){toast('سجّل الدخول أولاً');return authForm(false)}
  view=v;acctOpen=false;closeM();layout();chipsRender();load();
}
function openAcct(){closeM();acctOpen=true;layout();acctRender();window.scrollTo(0,0)}
function acctRender(){
  const row=(i,t,d,fn)=>`<div class="li" onclick="${fn}"><div class="ic">${ic(i,22)}</div><div><b>${t}</b>${d?`<div class="meta">${d}</div>`:''}</div><span class="ch">${ic('chev',20)}</span></div>`;
  $('#acct').innerHTML=(user?`<div class="card"><div class="li" style="padding:0;cursor:default"><div class="ic bl">${ic('user',22)}</div><div><b>${esc(user.email)}</b><div class="meta">حسابك فعّال</div></div></div></div>`
  :`<div class="card" onclick="authForm(false)" style="cursor:pointer"><div class="li" style="padding:0"><div class="ic bl">${ic('user',22)}</div><b>تسجيل الدخول أو إنشاء حساب</b></div><p class="meta" style="margin-top:8px">لحفظ المفضلة ونشر الإعلانات ورؤية أرقام البائعين.</p></div>`)
  +`<div class="card">${row('list','إعلاناتي','أضف أو عدّل أو احذف إعلاناتك',"setView('mine')")}${row('heart','المفضلة','',"setView('favs')")}${user?row('out','تسجيل الخروج','',"logout()"):''}</div>`;
}
async function logout(){await sb.auth.signOut();toast('تم تسجيل الخروج')}

/* ---------- auth ---------- */
function authForm(s){
  page(s?'إنشاء حساب':'تسجيل الدخول',`<div class="card">${s?'<label>الاسم</label><input class="f" id="n" maxlength="80" autocomplete="name"><label>رقم الهاتف</label><input class="f" id="ph" inputmode="tel" placeholder="07xxxxxxxxx" autocomplete="tel"><p class="meta">يظهر للمشترين المسجلين فقط</p>':''}<label>البريد الإلكتروني</label><input class="f" id="e" type="email" autocomplete="email"><label>كلمة المرور (8 أحرف على الأقل)</label><input class="f" id="p" type="password" autocomplete="${s?'new-password':'current-password'}"></div>`,
  `<div class="btns"><button class="b2" onclick="authForm(${!s})">${s?'عندي حساب':'حساب جديد'}</button><button class="b1" onclick="doAuth(${s})">${s?'إنشاء الحساب':'دخول'}</button></div>`);
}
async function doAuth(signup){
  const email=$('#e').value.trim(),pw=$('#p').value;
  if(!email||pw.length<8)return toast('اكتب البريد وكلمة مرور من 8 أحرف على الأقل');
  let r;
  if(signup){
    const name=$('#n').value.trim().slice(0,80),phone=$('#ph').value.trim();
    if(!/^[0-9+]{7,16}$/.test(phone))return toast('رقم الهاتف غير صحيح');
    r=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name,phone}}});
    if(!r.error&&!r.data.session){closeM();return toast('تم التسجيل. فعّل حسابك من رسالة البريد ثم سجّل الدخول',6000)}
  }else r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return toast('تعذر الدخول. تحقق من البيانات');
  closeM();
}
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;loadFavs().then(()=>{if(!user&&view!=='all')view='all';layout();if(acctOpen)acctRender();load()})});
async function loadFavs(){
  favs=new Set();if(!user)return;
  const {data}=await sb.from('favorites').select('car_id');
  (data||[]).forEach(f=>favs.add(f.car_id));
}

/* ---------- list ---------- */
const F={q:'',make:'',model:'',city:'',yfrom:'',yto:'',pmin:'',pmax:'',cur:'USD',fuel:'',tr:'',co:'',km:'',sort:'new',body:''};
const BRANDS=[['تويوتا','toyota'],['هيونداي','hyundai'],['كيا','kia'],['نيسان','nissan'],['شيفروليه','chevrolet'],['فورد','ford'],['مرسيدس','mercedes'],['بي إم دبليو','bmw'],['لكزس','lexus'],['هوندا','honda'],['ميتسوبيشي','mitsubishi'],['مازدا','mazda'],['جي إم سي','gmc'],['دودج','dodge'],['جيب','jeep'],['سوزوكي','suzuki'],['بيجو','peugeot'],['رينو','renault'],['أودي','audi'],['فولكس فاجن','volkswagen'],['إم جي','mg'],['جيلي','geely'],['شانجان','changan'],['بي واي دي','byd']];
const BODY={sedan:['سيدان','M3 22v-5c0-1 1-2 2-2l9-2 6-6h20l8 6 9 2c1 0 2 1 2 2v5z'],suv:['دفع رباعي','M3 22v-8c0-1 1-2 2-2h6l4-7h30l6 7h8c1 0 2 1 2 2v8z'],hatchback:['هاتشباك','M5 22v-6c0-1 1-2 2-2l7-1 6-7h15l7 7h9c1 0 2 1 2 2v7z'],pickup:['بيك أب','M3 22v-6c0-1 1-2 2-2h6l5-7h14l3 7h28v8z'],coupe:['كوبيه','M3 22v-4c0-1 1-2 2-2l10-1 9-6h14l11 6 9 2c1 0 2 1 2 2v3z'],van:['فان','M3 22V10c0-1 1-3 3-3h38l10 8h3c1 0 2 1 2 2v5z']};
const svgBody=d=>`<svg viewBox="0 0 64 32" width="64" height="32"><path fill="currentColor" d="${d}"/><circle class="w" cx="15" cy="23" r="4.5"/><circle class="w" cx="49" cy="23" r="4.5"/></svg>`;
const YEARS=[];for(let y=2027;y>=1950;y--)YEARS.push(y);
const yOpts=ph=>`<option value="">${ph}</option>`+YEARS.map(y=>`<option>${y}</option>`).join('');
function tiles(id,kind,cur){
  const items=kind==='brand'?BRANDS.map(([n,k])=>[n,n,`<span class="lg"><b>${k[0].toUpperCase()}</b><img src="${SB_URL}/storage/v1/object/public/brand-logos/${k}.png" alt="" loading="lazy" onerror="this.remove()"></span>`]):Object.entries(BODY).map(([k,[n,d]])=>[k,n,svgBody(d)]);
  return `<div class="tiles${kind==='brand'?' cut':''}" id="${id}">${items.map(([v,n,h])=>`<button type="button" class="tile${v===cur?' on':''}" data-v="${esc(v)}" onclick="pickTile(this)">${h}<span>${n}</span></button>`).join('')}</div>${kind==='brand'?`<button type="button" class="more" onclick="this.previousElementSibling.classList.remove('cut');this.remove()">عرض كل الماركات</button>`:''}`;
}
function pickTile(b){const on=b.classList.contains('on');b.parentNode.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));if(!on)b.classList.add('on')}
const sel=id=>{const e=document.querySelector('#'+id+' .on');return e?e.dataset.v:''};
const SORT={new:'الأحدث',cheap:'الأرخص',exp:'الأغلى',year:'الأحدث موديلاً'};
const cl=x=>String(x||'').replace(/[^\p{L}\p{N} ]/gu,'').trim();
async function load(){
  const mine=view==='mine'&&user;
  const so=mine||view==='favs'?['created_at',false]:{new:['created_at',false],cheap:['price',true],exp:['price',false],year:['year',false]}[F.sort];
  let qb=sb.from('cars').select('*').order(so[0],{ascending:so[1]}).limit(60);
  if(mine)qb=qb.eq('user_id',user.id);
  else{
    qb=qb.eq('is_sold',false);
    if(view==='favs'){const ids=[...favs];if(!ids.length){cars=[];return render()}qb=qb.in('id',ids)}
    else{
      const q=cl(F.q),mk=cl(F.make),md=cl(F.model);
      if(q)qb=qb.or(`title.ilike.%${q}%,make.ilike.%${q}%,model.ilike.%${q}%`);
      if(mk)qb=qb.ilike('make',`%${mk}%`);
      if(md)qb=qb.ilike('model',`%${md}%`);
      if(F.city)qb=qb.eq('city',F.city);
      if(F.body)qb=qb.eq('body_type',F.body);
      if(F.fuel)qb=qb.eq('fuel',F.fuel);
      if(F.tr)qb=qb.eq('transmission',F.tr);
      if(F.co)qb=qb.eq('condition',F.co);
      if(F.yfrom)qb=qb.gte('year',parseInt(F.yfrom));
      if(F.yto)qb=qb.lte('year',parseInt(F.yto));
      if(F.pmin||F.pmax){qb=qb.eq('currency',F.cur);if(F.pmin)qb=qb.gte('price',Number(F.pmin));if(F.pmax)qb=qb.lte('price',Number(F.pmax))}
      if(F.km)qb=qb.lte('mileage',Number(F.km));
    }
  }
  const {data,error}=await qb;
  if(error)toast('تعذر تحميل السيارات');
  cars=data||[];render();
}
/* ---------- search menu ---------- */
function chipsRender(){
  const u=F.cur==='USD'?'$':'د.ع',nf=v=>Number(v).toLocaleString('en-US');
  const L={make:()=>F.make,body:()=>(BODY[F.body]||[])[0],model:()=>F.model,city:()=>F.city,fuel:()=>FUEL[F.fuel],tr:()=>TR[F.tr],co:()=>CO[F.co],yfrom:()=>'من سنة '+F.yfrom,yto:()=>'حتى سنة '+F.yto,pmin:()=>'من '+nf(F.pmin)+' '+u,pmax:()=>'حتى '+nf(F.pmax)+' '+u,km:()=>'حتى '+nf(F.km)+' كم'};
  const keys=Object.keys(L).filter(k=>F[k]);
  $('#chips').innerHTML=(F.sort!=='new'?`<button class="chip" onclick="rm('sort')">${SORT[F.sort]} ✕</button>`:'')+keys.map(k=>`<button class="chip" onclick="rm('${k}')">${esc(L[k]())} ✕</button>`).join('');
  $('#fcnt').hidden=!keys.length;$('#fcnt').textContent=keys.length;
}
function rm(k){F[k]=k==='sort'?'new':'';chipsRender();load()}
let T={};
const opt=(k,o)=>`<div class="opt">${Object.entries(o).map(([v,l])=>`<button class="${T[k]===v?'on':''}" onclick="pick('${k}','${v}',this)">${l}</button>`).join('')}</div>`;
function pick(k,v,b){T[k]=T[k]===v&&k!=='sort'?'':v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(T[k]===v)b.classList.add('on')}
function filterPage(){
  T={...F};
  page('الفلاتر',`<div class="card"><b>الترتيب</b>${opt('sort',SORT)}</div>
  <div class="card"><b>الماركة</b>${tiles('t_make','brand',F.make)}</div>
  <div class="card"><b>نوع السيارة</b>${tiles('t_body','body',F.body)}<label>الموديل (اختياري)</label><input class="f" id="g_model" value="${esc(F.model)}" placeholder="مثال: كورولا"></div>
  <div class="card"><b>المدينة</b><select class="f" id="g_city" style="margin-top:8px">${cityOpts('كل المدن')}</select></div>
  <div class="card"><b>سنة الصنع</b><div class="g2"><select class="f" id="g_yf">${yOpts('من سنة')}</select><select class="f" id="g_yt">${yOpts('إلى سنة')}</select></div></div>
  <div class="card"><b>السعر</b><div class="g2"><input class="f" id="g_pmin" type="number" inputmode="numeric" placeholder="من" value="${esc(F.pmin)}"><input class="f" id="g_pmax" type="number" inputmode="numeric" placeholder="إلى" value="${esc(F.pmax)}"></div><select class="f" id="g_cur" style="margin-top:8px"><option value="USD">دولار $</option><option value="IQD">دينار د.ع</option></select></div>
  <div class="card"><b>الوقود</b>${opt('fuel',FUEL)}<label>ناقل الحركة</label>${opt('tr',TR)}<label>الحالة</label>${opt('co',CO)}<label>أقصى مسافة (كم)</label><input class="f" id="g_km" type="number" inputmode="numeric" value="${esc(F.km)}"></div>`,
  `<div class="btns"><button class="b2" onclick="clearF()">مسح الكل</button><button class="b1" onclick="applyF()">عرض النتائج</button></div>`);
  $('#g_city').value=F.city;$('#g_cur').value=F.cur;$('#g_yf').value=F.yfrom;$('#g_yt').value=F.yto;
}
function applyF(){
  const g=id=>$('#'+id).value.trim();
  Object.assign(F,{sort:T.sort||'new',fuel:T.fuel||'',tr:T.tr||'',co:T.co||'',make:sel('t_make'),body:sel('t_body'),model:g('g_model'),city:$('#g_city').value,yfrom:g('g_yf'),yto:g('g_yt'),pmin:g('g_pmin'),pmax:g('g_pmax'),cur:$('#g_cur').value,km:g('g_km')});
  closeM();chipsRender();load();
}
function clearF(){Object.assign(F,{body:'',make:'',model:'',city:'',yfrom:'',yto:'',pmin:'',pmax:'',fuel:'',tr:'',co:'',km:'',sort:'new'});closeM();chipsRender();load()}
const pn=c=>Number(c.price).toLocaleString('en-US'),pu=c=>c.currency==='USD'?'$':'د.ع';
function render(){
  const g=$('#grid');$('#cnt').textContent=cars.length+' سيارة';
  if(!cars.length){g.innerHTML='<div class="empty">'+(view==='mine'?'ما عندك إعلانات بعد. اضغط «بيع» من الأسفل.':view==='favs'?'ما عندك سيارات مفضلة.':'ما لكينا سيارات بهذي الفلاتر.')+'</div>';return}
  g.innerHTML=cars.map((c,i)=>{
    const im=safeImg((c.images||[])[0]),id=esc(c.id);
    return `<div class="car" style="--i:${Math.min(i,10)}" onclick="detail('${id}')">
      ${im?`<img src="${esc(im)}" alt="${esc(c.title)}" loading="lazy">`:'<div class="ph0"></div>'}
      ${c.is_sold?'<span class="sold">مباعة</span>':''}
      <button class="heart ${favs.has(c.id)?'on':''}" aria-label="مفضلة" onclick="event.stopPropagation();toggleFav('${id}')">${ic('heart',20)}</button>
      <div class="in"><h3>${esc(c.title)}</h3><div class="pr"><b>${esc(pn(c))}</b> <span>${pu(c)}</span></div>
      <div class="meta">${esc(c.year)}${c.mileage!=null?' • '+esc(Number(c.mileage).toLocaleString('en-US'))+' كم':''}${c.city?' • '+esc(c.city):''}</div>
      ${view==='mine'?`<button class="mini" onclick="event.stopPropagation();markSold('${id}',${!c.is_sold})">${c.is_sold?'إعادة العرض':'تم البيع'}</button><button class="mini" onclick="event.stopPropagation();delCar('${id}')">حذف</button>`:''}
      </div></div>`}).join('');
}
async function toggleFav(id){
  if(!user){toast('سجّل الدخول لحفظ المفضلة');return authForm(false)}
  if(favs.has(id)){favs.delete(id);await sb.from('favorites').delete().eq('car_id',id)}
  else{favs.add(id);await sb.from('favorites').insert({car_id:id})}
  view==='favs'?load():render();
}
async function markSold(id,v){const {error}=await sb.from('cars').update({is_sold:v}).eq('id',id);if(error)toast('تعذر التحديث');load()}
async function delCar(id){if(!confirm('حذف الإعلان نهائياً؟'))return;const {error}=await sb.from('cars').delete().eq('id',id);if(error)toast('تعذر الحذف');load()}

/* ---------- detail ---------- */
function detail(id){
  const c=cars.find(x=>x.id===id);if(!c)return;
  const imgs=(c.images||[]).map(safeImg).filter(Boolean);
  page(c.title,`${imgs.length?`<div class="gal">${imgs.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}
  <div class="card"><dl><dt>الماركة</dt><dd>${esc(c.make)} ${esc(c.model)}</dd><dt>السنة</dt><dd>${esc(c.year)}</dd>
  ${c.mileage!=null?`<dt>المسافة</dt><dd>${esc(Number(c.mileage).toLocaleString('en-US'))} كم</dd>`:''}
  ${c.body_type&&BODY[c.body_type]?`<dt>النوع</dt><dd>${esc(BODY[c.body_type][0])}</dd>`:''}${c.fuel?`<dt>الوقود</dt><dd>${esc(FUEL[c.fuel])}</dd>`:''}${c.transmission?`<dt>الكير</dt><dd>${esc(TR[c.transmission])}</dd>`:''}
  ${c.condition?`<dt>الحالة</dt><dd>${esc(CO[c.condition])}</dd>`:''}${c.city?`<dt>المدينة</dt><dd>${esc(c.city)}</dd>`:''}</dl></div>
  ${c.description?`<div class="card"><p style="white-space:pre-wrap">${esc(c.description)}</p></div>`:''}
  <div id="contact"></div>`,
  `<div class="sum"><span>السعر</span><b>${esc(pn(c))} ${pu(c)}</b></div><div class="btns"><button class="b2" onclick="closeM()">رجوع</button><button class="b1" onclick="showContact('${esc(c.id)}')">رقم البائع</button></div>`);
}
async function showContact(id){
  if(!user){toast('سجّل الدخول لرؤية رقم البائع');return authForm(false)}
  const {data,error}=await sb.rpc('get_seller_contact',{p_car_id:id});
  const s=data&&data[0];
  if(error||!s||!s.phone)return toast('رقم البائع غير متوفر');
  const p=phoneClean(s.phone);
  $('#contact').innerHTML=`<div class="card"><p><b>${esc(s.full_name||'البائع')}</b></p><br><a class="lnk" href="tel:${esc(p)}">اتصال ${esc(p)}</a><a class="lnk" target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(waNum(p))}">واتساب</a></div>`;
}

/* ---------- sell ---------- */
function sellForm(){
  if(!user){toast('سجّل الدخول لإضافة إعلان');return authForm(false)}
  page('إضافة إعلان',`<div class="card"><b>معلومات السيارة</b>
  <label>الماركة *</label>${tiles('t_make','brand','')}<label>نوع السيارة</label>${tiles('t_body','body','')}<label>الموديل *</label><input class="f" id="s_model" maxlength="50" placeholder="مثال: كورولا">
  <div class="g2"><div><label>السنة *</label><select class="f" id="s_year">${yOpts('اختر')}</select></div><div><label>المسافة (كم)</label><input class="f" id="s_km" type="number" inputmode="numeric"></div></div>
  <div class="g2"><div><label>الوقود</label><select class="f" id="s_fuel">${opts(FUEL,'—')}</select></div><div><label>الكير</label><select class="f" id="s_tr">${opts(TR,'—')}</select></div></div>
  <div class="g2"><div><label>الحالة</label><select class="f" id="s_co">${opts(CO,'—')}</select></div><div><label>المدينة</label><select class="f" id="s_city">${cityOpts('—')}</select></div></div></div>
  <div class="card"><b>السعر</b><div class="g2" style="grid-template-columns:2fr 1fr"><input class="f" id="s_price" type="number" inputmode="numeric" placeholder="السعر *"><select class="f" id="s_cur"><option value="USD">دولار $</option><option value="IQD">دينار د.ع</option></select></div></div>
  <div class="card"><b>الوصف والصور</b><label>وصف</label><textarea class="f" id="s_desc" maxlength="2000"></textarea><label>الصور (حتى 10، كل صورة أقل من 5MB)</label><input class="f" id="s_img" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>`,
  `<div class="btns"><button class="b2" onclick="closeM()">رجوع</button><button class="b1" id="s_go" onclick="submitCar()">نشر الإعلان</button></div>`);
}
async function submitCar(){
  const v=id=>$('#'+id).value.trim(),n=id=>v(id)===''?null:Number(v(id));
  const make=sel('t_make'),model=v('s_model'),year=n('s_year'),pr=n('s_price');
  if(!make||!model||!year||!pr)return toast('عبّي الماركة والموديل والسنة والسعر');
  if(year<1950||year>new Date().getFullYear()+1||pr<=0)return toast('تحقق من السنة والسعر');
  const files=[...$('#s_img').files];
  if(files.length>10)return toast('الحد الأقصى 10 صور');
  for(const f of files)if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880)return toast('الصور: jpg/png/webp وأقل من 5MB');
  const b=$('#s_go');b.disabled=true;b.textContent='جاري النشر...';
  try{
    const urls=[];
    for(const [i,f] of files.entries()){
      const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];
      const path=`${user.id}/${Date.now()}_${i}.${ext}`;
      const {error}=await sb.storage.from('car-images').upload(path,f,{contentType:f.type});
      if(error)throw error;
      urls.push(sb.storage.from('car-images').getPublicUrl(path).data.publicUrl);
    }
    const row={title:`${make} ${model} ${year}`.slice(0,120),make,model,year,price:pr,currency:v('s_cur'),mileage:n('s_km'),
      body_type:sel('t_body')||null,fuel:v('s_fuel')||null,transmission:v('s_tr')||null,condition:v('s_co')||null,city:v('s_city')||null,description:v('s_desc')||null,images:urls};
    const {error}=await sb.from('cars').insert(row);
    if(error)throw error;
    toast('تم نشر الإعلان');setView('mine');
  }catch(e){toast('تعذر النشر. تأكد من البيانات وحاول مرة ثانية');b.disabled=false;b.textContent='نشر الإعلان'}
}
layout();load();
</script>
</body>
